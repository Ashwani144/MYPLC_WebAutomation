# Development environment configuration.
# Values here are overridden by matching environment variables at runtime.
base_url: "https://qa-myplc.iapmo.org/"
api_base_url: "https://jsonplaceholder.typicode.com"
browser: "chromium"
headless: false
slow_mo: 500
viewport_width: 1920
viewport_height: 1080
default_timeout: 30000
navigation_timeout: 30000
retries: 1
workers: 4
locale: "en-US"
timezone: "UTC"
record_video: false
record_trace: false
screenshot_on_failure: true
image_threshold: 1

use_selenium_grid: false
selenium_grid_url: "http://localhost:4444/wd/hub"
use_browserstack: false
use_lambdatest: false
