[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ensure the project root is importable so local packages (fixtures, reporters,
# config, utils) resolve when running via the ``pytest`` entrypoint, not just
# ``python -m pytest``.
pythonpath = .

# Default options:
# - verbose output
# - custom metrics reporter plugin
# - Playwright HTML report
# - Allure results
# - JUnit XML for CI
# - rerun flaky failures (excluding the intentional-failure demos handled by markers)
# NOTE: parallelism (-n) is passed on the CLI / in CI to keep local debugging simple.
addopts =
    -v
    -ra
    --strict-markers
    --html=reports/html/report.html
    --self-contained-html
    --css=reporters/report.css
    --alluredir=reports/allure-results
    --junitxml=reports/junit/results.xml
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/test-artifacts

markers =
    smoke: quick sanity checks
    regression: full regression suite
    ui: browser UI tests
    api: REST API tests
    visual: visual regression tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
